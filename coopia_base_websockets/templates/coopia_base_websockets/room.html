<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Room</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-6">
    <div class="w-full max-w-4xl bg-white shadow-md rounded-lg p-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-4">Chat Room</h1>
        
        <textarea id="chat-log-common" cols="100" rows="10" readonly 
            class="w-full p-4 border border-gray-300 rounded-lg mb-4 bg-gray-50 resize-none"></textarea>
        
        <div id="global-submission-remaining" 
            class="mb-4 text-lg font-semibold text-gray-700">
            <!-- Remaining submissions will be shown here -->
        </div>
        
        <div id="idea-inputs" class="space-y-4">
            <!-- Container for base and added idea inputs -->
        </div>
    </div>

    {{ room_name|json_script:"room-name" }}
    <script>
        class ChatInput {
            static totalSubmits = 0;
            static maxSubmits = Infinity;
            static instances = [];
            static globalCountElement = document.getElementById('global-submission-remaining');

            constructor(socket, container, defaultValue = '', autoFocus = false) {
                this.socket = socket;
                this.container = container;
                this.submitCount = 0;

                // Create form and input elements
                this.form = document.createElement('form');
                // Set the form to grow and take remaining space
                this.form.className = "flex items-center space-x-2 flex-grow";

                // Create a radio button for selecting the input
                this.radio = document.createElement('input');
                this.radio.type = 'radio';
                this.radio.name = 'selectedChatInput';
                this.radio.className = "mr-2";

                this.input = document.createElement('input');
                this.input.type = 'text';
                this.input.name = 'message';
                this.input.value = defaultValue;
                this.input.autocomplete = 'off';
                this.input.className = "flex-1 p-2 border border-gray-300 rounded-lg";
                this.input.placeholder = "Ecris ton idée ici...";

                this.button = document.createElement('button');
                this.button.type = 'submit';
                this.button.textContent = 'Promouvoir l\'idée';
                this.button.className = "px-4 py-2 bg-green-500 text-white font-semibold rounded-lg shadow hover:bg-green-600";

                if (ChatInput.totalSubmits >= ChatInput.maxSubmits) {
                    this.disable();
                }

                // Create a small box for the click count
                this.countBox = document.createElement('div');
                this.countBox.className = "px-3 py-1 bg-gray-200 text-gray-700 font-bold rounded-lg";
                this.countBox.textContent = '0';

                // Append the input, button, and count box to the form
                this.form.appendChild(this.input);
                this.form.appendChild(this.button);
                this.form.appendChild(this.countBox);

                // Wrap radio and form in a flex container
                this.wrapper = document.createElement('div');
                this.wrapper.className = "flex items-center w-full space-x-2"; // Full width wrapper

                this.wrapper.appendChild(this.radio);
                this.wrapper.appendChild(this.form);

                this.container.appendChild(this.wrapper);

                // Focus input if requested
                if (autoFocus) this.input.focus();

                // Handle form submission
                this.form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.sendMessage();
                });

                this.input.addEventListener('input', () => {
                    ChatInput.ensureEmptyInput(socket, container);
                });

                // Register this instance
                ChatInput.instances.push(this);
                ChatInput.updateGlobalCountDisplay();
            }

            sendMessage() {
                if (ChatInput.totalSubmits >= ChatInput.maxSubmits) {
                    this.disableAllInputs();
                    return;
                }

                const message = this.input.value.trim();
                if (message !== '') {
                    this.socket.send(JSON.stringify({ message }));
                    this.submitCount += 1;
                    ChatInput.totalSubmits += 1;

                    // Update the count box with the number of clicks
                    this.updateCountBox();

                    // Update global remaining submissions
                    ChatInput.updateGlobalCountDisplay();

                    if (ChatInput.totalSubmits >= ChatInput.maxSubmits) {
                        this.disableAllInputs();
                    }
                }
            }

            updateCountBox() {
                this.countBox.textContent = this.submitCount;
            }

            static updateGlobalCountDisplay() {
                if (ChatInput.globalCountElement) {
                    const remaining = Math.max(ChatInput.maxSubmits - ChatInput.totalSubmits, 0);
                    ChatInput.globalCountElement.textContent = `Promotions restantes: ${remaining}`;

                    // Update styling based on remaining submissions
                    ChatInput.globalCountElement.className = `text-lg font-semibold ${
                        remaining <= 1 ? 'text-red-500' : 'text-gray-700'
                    } text-right`;
                }
            }

            disable() {
                this.button.disabled = true;
                this.input.disabled = true;
            }

            disableAllInputs() {
                ChatInput.instances.forEach(instance => instance.disable());
            }

            static ensureEmptyInput(socket, container) {
                const hasEmptyInput = ChatInput.instances.some(instance => instance.input.value.trim() === '');
                if (!hasEmptyInput) {
                    new ChatInput(socket, container, '', false);
                }
            }

            static isIdeaPresent(text) {
                return ChatInput.instances.some(instance => instance.input.value.trim() === text.trim());
            }
        }

        const roomName = JSON.parse(document.getElementById('room-name').textContent);

        const chatSocket = new WebSocket(
            'ws://'
            + window.location.host
            + '/ws/coopiabasewebsockets/'
            + roomName
            + '/'
        );

        // maximum number of promotions allowed
        ChatInput.maxSubmits = 3;

        // Add a radio button labeled "Attendre plus d'idées"
        const waitRadioContainer = document.createElement('div');

        const waitRadio = document.createElement('input');
        waitRadio.type = 'radio';
        waitRadio.name = 'selectedChatInput';
        waitRadio.value = 'wait';
        waitRadio.checked = true; // Automatically select it on page load

        const waitLabel = document.createElement('label');
        waitLabel.textContent = "Attendre plus d'idées";
        waitLabel.style.marginLeft = '8px';

        waitRadioContainer.appendChild(waitRadio);
        waitRadioContainer.appendChild(waitLabel);
        document.getElementById('idea-inputs').appendChild(waitRadioContainer);

        new ChatInput(chatSocket, document.getElementById('idea-inputs'), '', autoFocus=true);

        chatSocket.onmessage = function(e) {
            const data = JSON.parse(e.data);

            if (data.type === 'common') {
                document.querySelector('#chat-log-common').value += (data.message + '\n');
            } else if (data.type === 'promoted_idea') {
                // Check if the idea is already present
                if (!ChatInput.isIdeaPresent(data.message)) {
                    new ChatInput(chatSocket, document.getElementById('idea-inputs'), data.message);
                } else {
                    // Send the message back through the WebSocket
                    chatSocket.send(e.data);
                }
            } else {
                console.error('Unknown message type:', data.type);
            }
        };

        chatSocket.onclose = function(e) {
            console.error('Chat socket closed unexpectedly');
        };
    </script>
</body>
</html>
