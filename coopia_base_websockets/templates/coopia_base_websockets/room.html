<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Room</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white min-h-screen flex flex-col items-center px-2 sm:px-4 md:px-6 py-4">
    <div class="w-full max-w-full sm:max-w-2xl bg-white px-2 sm:px-4 md:px-6 py-4">
        <!-- Task Description -->
        <div id="task-description"
            class="w-full mb-4 px-2 py-1 text-gray-700 text-base font-serif leading-relaxed text-left"
            style="word-break:break-word; white-space:pre-line; min-height:2em;">
        </div>
        <div id="participant-count" class="text-gray-500 text-sm mt-4 text-right">
            <!-- Container for participants count -->
        </div>
        <div id="chat-log-common" 
            class="w-full p-2 rounded-lg mb-4 resize-none whitespace-pre-wrap font-mono min-h-[2em] leading-snug text-left text-indent-0">
        </div>

        <div class="flex justify-between items-center mb-4 text-lg font-semibold text-gray-700">
            <div id="round-countdown" 
                class="mb-4 text-lg font-semibold text-gray-700 flex items-center">
                <!-- Countdown will be shown here -->
            </div>

            <div id="global-submission-remaining" 
                class="mb-4 text-lg font-semibold text-gray-700">
                <!-- Remaining submissions will be shown here -->
            </div>
        </div>
        
        <div id="idea-inputs" class="space-y-4">
            <!-- Container for base and added idea inputs -->
        </div>
        
        <div id="vote-button" class="w-full max-w-2xl mt-4 flex items-center space-x-4">
            <!-- div with button and text -->
        </div>
    </div>

    {{ room_name|json_script:"room-name" }}
    {% load static %}
    <!-- Ceci permet de mettre à jour le script JS a chaque refresh du client. 
     Ceci retire les benefices du caching -> a retirer quand on mode production-->
    <script type="module" src="{% static 'coopia_base_websockets/js/room_main.js' %}?v={% now 'U' %}"></script>
     <!-- <script src="room_main.js"></script> -->
</body>
</html>
