<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>Chat Room</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-dvh flex flex-col sm:items-center sm:justify-center sm:py-4">
    <div id="room-container" class="w-full h-dvh sm:max-w-xl bg-white flex flex-col mx-auto sm:rounded-lg sm:shadow-lg">
        <!-- Header -->
        <div id="header" class="flex justify-between items-start px-2 sm:px-4 md:px-6 py-4 flex-shrink-0">
            <div></div>
            <div id="participant-count" class="text-gray-500 text-sm flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="1.3em" height="1.3em" viewBox="0 0 16 16" class="inline-block">
                    <path d="M0 0h16v16H0z" fill="none" />
                    <path fill="none" stroke="currentColor" d="M10.8 14v-1.7a2 2 0 0 0-2-2H7.2a2 2 0 0 0-2 2V14m9.3-3.5V9.3a2 2 0 0 0-2-2H11m-9.5 3.2V9.3a2 2 0 0 1 2-2H5m4.605-.195a1.605 1.605 0 1 1-3.21 0a1.605 1.605 0 0 1 3.21 0Zm3.8-3a1.605 1.605 0 1 1-3.21 0a1.605 1.605 0 0 1 3.21 0Zm-7.5 0a1.605 1.605 0 1 1-3.21 0a1.605 1.605 0 0 1 3.21 0Z" />
                </svg>
                <span id="participant-count-value">?</span>
            </div>
        </div>
        
        <!-- Middle Frame (scrollable) -->
        <div id="process-result-display" 
            class="flex-1 min-h-0 overflow-y-auto px-2 sm:px-4 md:px-6 py-4 whitespace-pre-wrap font-mono leading-snug text-left">
        </div>
        
        <!-- Footer -->
        <div id="participant-input-container" class="flex items-end space-x-0 px-2 sm:px-4 md:px-6 py-4 flex-shrink-0">
            <div id="idea-inputs" class="flex-1 space-y-4">
                <!-- Container for base and added idea inputs -->
            </div>
            <div id="vote-button" class="flex items-center space-x-4">
                <!-- div with button and text -->
            </div>
        </div>
    </div>

    {{ room_name|json_script:"room-name" }}
    {% load static %}
    <!-- Ceci permet de mettre à jour le script JS a chaque refresh du client. 
     Ceci retire les benefices du caching -> a retirer quand on mode production-->
    <script type="module" src="{% static 'coopia_base_websockets/js/room_main.js' %}?v={% now 'U' %}"></script>
     <!-- <script src="room_main.js"></script> -->
</body>
</html>
