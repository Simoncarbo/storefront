<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>Chat Room</title>
    <script src="https://unpkg.com/htmx.org"></script>
    <script src="https://unpkg.com/htmx.org/dist/ext/ws.js"></script>
</head>
<body>
    <textarea id="chat-log-common" cols="100" rows="20"></textarea><br>
    <textarea id="chat-log" cols="100" rows="20"></textarea><br>
    <input id="chat-message-input" type="text" size="100"><br>
    <!-- Input button for sending chat messages -->
    <input 
        id="chat-message-submit" 
        type="button" 
        value="Send" 
        hx-trigger="click, keyup[enter]" 
        hx-ws="send:{'message': chatMessageInput.value}"
    >
    >
    {{ room_name|json_script:"room-name" }}

    <script>
        const roomName = JSON.parse(document.getElementById('room-name').textContent);
        const ws = new WebSocket(`ws://window.location.host/ws/coopiabasewebsockets/${roomName}`);
    
        ws.onmessage = function(event) {
        const data = JSON.parse(event.data);

        // Check the type of message or content to determine the target
        if (data.target === 'chat-log') {
            document.querySelector('#chat-log').value += data.message + '\n';
        } else if (data.target === 'chat-log-common') {
            document.querySelector('#chat-log-common').value += data.message + '\n';
        }
    };
    </script>
</body>
</html>
