<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>Chat Room</title>
</head>
<body>
    <textarea id="chat-log-common" cols="100" rows="20" readonly></textarea><br>
    <textarea id="chat-log" cols="100" rows="20" readonly></textarea><br>
    <div id="idea-inputs">
    <input id="chat-message-input" type="text" size="100" autofocus><br>
    <input id="chat-message-submit" type="button" value="Send">
    </div> <!-- Container for base and added idea inputs -->

    {{ room_name|json_script:"room-name" }}
    <script>
        const roomName = JSON.parse(document.getElementById('room-name').textContent);

        const chatSocket = new WebSocket(
            'ws://'
            + window.location.host
            + '/ws/coopiabasewebsockets/'
            + roomName
            + '/'
        );

        chatSocket.onmessage = function(e) {
            const data = JSON.parse(e.data);

            // Check the type of the message and append it to the appropriate log
            if (data.type === 'common') {
                document.querySelector('#chat-log-common').value += (data.message + '\n');
            } else if (data.type === 'promoted_idea') {
                document.querySelector('#chat-log').value += (data.message + '\n');

                // Create a new input/submit pair for the promoted idea
                const dynamicInputsContainer = document.getElementById('idea-inputs');

                const newInput = document.createElement('input');
                newInput.type = 'text';
                newInput.size = 100;
                newInput.placeholder = data.message; // Set the placeholder to the promoted idea

                const newSubmit = document.createElement('input');
                newSubmit.type = 'button';
                newSubmit.value = 'Send';

                // Add event listener to the new submit button
                newSubmit.onclick = function() {
                    const message = newInput.value;
                    if (message.trim() !== '') {
                        chatSocket.send(JSON.stringify({
                            'message': message
                        }));
                        newInput.value = ''; // Clear the input field after sending
                    }
                };
                newInput.onkeyup = function(e) {
                    if (e.key === 'Enter') {
                        newSubmit.click();
                    }
                };

                // Append the new input and submit button to the container
                dynamicInputsContainer.appendChild(newInput);
                dynamicInputsContainer.appendChild(newSubmit);
                dynamicInputsContainer.appendChild(document.createElement('br')); // Add a line break
            } else {
                console.error('Unknown message type:', data.type);
            }
        };

        chatSocket.onclose = function(e) {
            console.error('Chat socket closed unexpectedly');
        };

        document.querySelector('#chat-message-submit').onclick = function(e) {
            const messageInput = document.querySelector('#chat-message-input');
            const message = messageInput.value;

            if (message.trim() !== '') {
                chatSocket.send(JSON.stringify({
                    'message': message
                }));
                messageInput.value = '';
            }
        };

        document.querySelector('#chat-message-input').onkeyup = function(e) {
            if (e.key === 'Enter') {
                document.querySelector('#chat-message-submit').click();
            }
        };
    </script>
</body>
</html>
